name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: cli
      # Type-checks against the committed public API document and runs the command line and both actions against a fake API.
      - run: npm test
        working-directory: cli
